[package]
name = "shojiwm-shell"
version = "0.2.0"
edition = "2024"
description = "The shell of shojiwm-desktop: taskbar, Start menu, Control Panel, lock screen"
license = "MIT"

[[bin]]
name = "shojiwm-shell"
path = "src/main.rs"

[dependencies]
anti-webui = { git = "https://github.com/sachahjkl/AntiWebUI.git", rev = "945fd57", features = [
  "wayland-shell",
  "shell-network",
  "shell-battery",
  "shell-bluetooth",
  "shell-media",
  "shell-notifications",
  "shell-tray",
  "shell-session",
  "shell-audio",
  "shell-apps",
  "shell-process",
  "shell-system",
] }
serde_json = "1"
nucleo-matcher = "0.3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
strip = "debuginfo"

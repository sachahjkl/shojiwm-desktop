<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Original artwork: the Start orb under the pointer, without its glass:
    start-orb.svg brighter, with a halo.
    No clip paths: QtSvg ignores them, so every shape stays inside the body.
  -->
  <defs>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#9fe8ff" stop-opacity="0"/>
      <stop offset=".9" stop-color="#9fe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2ebf8"/>
      <stop offset=".5" stop-color="#78a8ca"/>
      <stop offset="1" stop-color="#33618a"/>
    </linearGradient>
    <linearGradient id="ringLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="body" cx=".5" cy=".98" r=".95">
      <stop offset="0" stop-color="#d4fbff"/>
      <stop offset=".3" stop-color="#36b4f5"/>
      <stop offset=".68" stop-color="#1366ad"/>
      <stop offset="1" stop-color="#0c3666"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4fbff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#d4fbff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="30.6" fill="url(#ring)" stroke="#0d2a45" stroke-opacity=".35" stroke-width=".8"/>
  <circle cx="32" cy="32" r="29.9" fill="none" stroke="url(#ringLight)" stroke-width=".9"/>
  <circle cx="32" cy="32" r="26.6" fill="#0a2742" fill-opacity=".6"/>
  <circle cx="32" cy="32" r="25.9" fill="url(#body)"/>
  <ellipse cx="32" cy="49" rx="16.5" ry="8" fill="url(#glow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Original artwork: the Start orb under the pointer, without its glass:
    start-orb.svg brighter, with a halo.
    No clip paths: QtSvg ignores them, so every shape stays inside the body.
  -->
  <defs>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#9fe8ff" stop-opacity="0"/>
      <stop offset=".9" stop-color="#9fe8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bezel" cx=".5" cy=".35" r=".65">
      <stop offset="0" stop-color="#3a5568"/>
      <stop offset=".7" stop-color="#16293a"/>
      <stop offset="1" stop-color="#0a141e"/>
    </radialGradient>
    <linearGradient id="bezelLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="body" cx=".5" cy=".98" r=".95">
      <stop offset="0" stop-color="#d4fbff"/>
      <stop offset=".3" stop-color="#36b4f5"/>
      <stop offset=".68" stop-color="#1366ad"/>
      <stop offset="1" stop-color="#0c3666"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d4fbff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d4fbff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="30" fill="url(#bezel)" stroke="#000000" stroke-opacity=".55"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#bezelLight)"/>
  <circle cx="32" cy="32" r="27" fill="url(#body)" stroke="#000000" stroke-opacity=".6"/>
  <ellipse cx="32" cy="51" rx="18.5" ry="9" fill="url(#glow)"/>
</svg>

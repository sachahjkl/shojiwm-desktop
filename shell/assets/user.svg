<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!--
    Original artwork: the default account picture. Full bleed, with no frame
    of its own: the frame is drawn round it (UserTile.qml).
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f2"/>
      <stop offset=".6" stop-color="#4f8fbf"/>
      <stop offset="1" stop-color="#2f6390"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e8f5"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" fill="url(#sky)"/>
  <circle cx="48" cy="37" r="15" fill="url(#person)"/>
  <path d="M17 96c4-20 16-31 31-31s27 11 31 31z" fill="url(#person)"/>
</svg>

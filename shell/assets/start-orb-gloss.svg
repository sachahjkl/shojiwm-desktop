<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Original artwork: the glass over the Start orb, drawn above its logo (as
    on Windows 7, the gloss covers the flag): a gloss across the top half and
    a thin light rim. Same geometry as start-orb.svg.
  -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="18.5" rx="20.5" ry="12.5" fill="url(#gloss)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ffffff" stroke-opacity=".3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Original artwork: the glass over the Start orb, drawn above its logo (as
    on Windows 7, the gloss covers the flag): a gloss across the top half and
    a thin light rim. Same geometry as start-orb.svg.
  -->
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="18" rx="19.5" ry="11.8" fill="url(#gloss)"/>
  <circle cx="32" cy="32" r="25.4" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!--
    Original artwork: the Start orb without its glass. A ring of steel-blue
    glass lit from above, a thin groove, and a blue body lit from below;
    the logo (start-orb-logo.svg) and the gloss (start-orb-gloss.svg) go on
    top. start-orb-hot.svg is the same orb under the pointer.
    No clip paths: QtSvg ignores them, so every shape stays inside the body.
  -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4cbdd"/>
      <stop offset=".5" stop-color="#56809f"/>
      <stop offset="1" stop-color="#26476a"/>
    </linearGradient>
    <linearGradient id="ringLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="body" cx=".5" cy=".98" r=".95">
      <stop offset="0" stop-color="#9ff0ff"/>
      <stop offset=".3" stop-color="#2390db"/>
      <stop offset=".68" stop-color="#0e4f8f"/>
      <stop offset="1" stop-color="#082a52"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9ff0ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#9ff0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="30.6" fill="url(#ring)" stroke="#0d2a45" stroke-opacity=".35" stroke-width=".8"/>
  <circle cx="32" cy="32" r="29.9" fill="none" stroke="url(#ringLight)" stroke-width=".9"/>
  <circle cx="32" cy="32" r="26.6" fill="#0a2742" fill-opacity=".6"/>
  <circle cx="32" cy="32" r="25.9" fill="url(#body)"/>
  <ellipse cx="32" cy="49" rx="16.5" ry="8" fill="url(#glow)"/>
</svg>

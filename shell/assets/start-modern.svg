<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!--
    Original artwork: the Start button of the modern style. A rounded tile of
    the accent blue with a soft light from the top, and a grid of nine dots.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9be0"/>
      <stop offset="1" stop-color="#2468b0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="28" height="28" rx="7" fill="url(#tile)"/>
  <rect x="4.5" y="4.5" width="27" height="27" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
  <g fill="#ffffff"><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="18" r="1.9"/><circle cx="12" cy="24" r="1.9"/><circle cx="18" cy="12" r="1.9"/><circle cx="18" cy="18" r="1.9"/><circle cx="18" cy="24" r="1.9"/><circle cx="24" cy="12" r="1.9"/><circle cx="24" cy="18" r="1.9"/><circle cx="24" cy="24" r="1.9"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
  <!--
    Original drawing of the round "go" button of a Windows 7 style log-on
    screen, after the measured colours of one: a dark blue ring, pale glass
    over the top half, blue below that brightens towards the bottom, and a
    broad solid white arrow with a faint shadow.
  -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4f5fd"/>
      <stop offset=".46" stop-color="#b7d6e8"/>
      <stop offset=".5" stop-color="#5b9cc4"/>
      <stop offset=".74" stop-color="#3a98cf"/>
      <stop offset="1" stop-color="#8be0ff"/>
    </linearGradient>
  </defs>
  <circle cx="14" cy="14" r="13.5" fill="#1f6894"/>
  <circle cx="14" cy="14" r="12" fill="url(#glass)"/>
  <circle cx="14" cy="14" r="11.5" fill="none" stroke="#ffffff" stroke-opacity=".5"/>
  <path d="M6 12h7.4V7.9l8 6.3-8 6.3v-4.1H6z" fill="#14476a" opacity=".3" transform="translate(0 1.1)"/>
  <path d="M6 11.7h7.4V7.6l8 6.3-8 6.3v-4.1H6z" fill="#f6fcff" stroke="#d7eefa" stroke-width=".6" stroke-linejoin="round"/>
</svg>

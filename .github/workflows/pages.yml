# Publishes site/ to GitHub Pages, with CHANGELOG.md as changelog.md (read by changelog.html), the logo and the screenshots of assets/site beside it:
# assets/site/*.webp in shots/, the Kernel captures in shots/kernel/, the close-ups in shots/details/.
# The pictures are the branch site-shots, checked out at assets/site.
# Pages use the "GitHub Actions" source (set once: gh api -X POST repos/sachahjkl/shojiwm-desktop/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [main]
  # After a new set of pictures on site-shots (one commit, replaced each time): run on main, the
  # only branch the github-pages environment deploys from.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push does not cancel one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # The light runner: a container that starts at once, enough to copy files.
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/checkout@v7
        with:
          ref: site-shots
          path: assets/site
      - uses: actions/configure-pages@v6
      - run: |
          mkdir -p _site/shots/kernel _site/shots/details
          cp -R site/. _site/
          cp CHANGELOG.md _site/changelog.md
          cp assets/logo.svg _site/logo.svg
          cp .project/image.png _site/logo.png
          cp assets/site/*.webp _site/shots/
          cp assets/site/kernel/*.webp _site/shots/kernel/
          cp assets/site/details/*.webp _site/shots/details/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

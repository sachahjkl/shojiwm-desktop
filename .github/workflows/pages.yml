# Publishes site/ to GitHub Pages, with the logo and the screenshots of assets/site beside it.
# Pages use the "GitHub Actions" source (set once: gh api -X POST repos/sachahjkl/shojiwm-desktop/pages -f build_type=workflow).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/logo.svg"
      - "assets/site/*.png"
      - ".project/image.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push does not cancel one that is running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: |
          mkdir -p _site/shots
          cp -R site/. _site/
          cp assets/logo.svg _site/logo.svg
          cp .project/image.png _site/logo.png
          cp assets/site/*.png _site/shots/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

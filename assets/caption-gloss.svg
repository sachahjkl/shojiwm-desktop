<svg xmlns="http://www.w3.org/2000/svg" width="100" height="28" viewBox="0 0 100 28" preserveAspectRatio="none">
  <!--
    Original artwork. The sheen of the caption bar: a bright upper band, a
    dull lower band, and a lit top edge. Drawn in a 100x28 box and stretched
    over the whole caption, so every stop is a fraction of its height.
  -->
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset=".44" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset=".92" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy="0" r=".72">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="28" fill="url(#sheen)"/>
  <rect width="100" height="28" fill="url(#bloom)"/>
  <rect width="100" height="1" fill="#ffffff" fill-opacity=".5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="4" height="34" viewBox="0 0 4 34" preserveAspectRatio="none">
  <!--
    The middle of the light behind the caption text: Windows 7 lays a white
    cloud under the title, dense in the middle of the text and fading a few
    pixels past it, so dark text reads on any glass. The decoration draws it
    in three pieces (title-glow-left, -middle, -right) so the rounded ends
    keep their size whatever the length of the title. A ShojiWM label cannot
    be blurred itself (its alpha and opacity are ignored), so this is the
    glow.
  -->
  <defs>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.84" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="4" height="34" fill="url(#down)"/>
</svg>

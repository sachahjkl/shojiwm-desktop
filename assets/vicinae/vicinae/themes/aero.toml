# Vicinae in the colours of the Start menu: pale glass, dark blue text, and
# the light blue band with a thin frame that marks a selection in Windows 7.
#
# The compositor blurs what is behind the launcher (launcher_window.opacity in
# aero.json), so the background is the tint of that blur, as for the shell.

[meta]
name = "Aero"
description = "Windows 7 Aero glass, matching the shojiwm-win7 Start menu"
variant = "light"
inherits = "vicinae-light"

[colors.core]
accent = "#3f82b4"
accent_foreground = "#ffffff"
background = "#f2f7fc"
foreground = "#10283c"
secondary_background = "#dfeaf4"
border = "#12314b"

[colors.main_window]
border = "#12314b"
footer = { background = "#dce8f3" }

[colors.settings_window]
border = "#12314b"

[colors.accents]
blue = "#1f6fc5"
green = "#2f8a3e"
magenta = "#b23a86"
orange = "#d9731a"
red = "#c42b1c"
yellow = "#b78a00"
cyan = "#1a8fa6"
purple = "#7a4cc2"

[colors.shortcut]
border = "#8fa9bf"

[colors.text]
default = "#10283c"
muted = "#4d6578"
danger = "#c42b1c"
success = "#2f8a3e"
placeholder = "#7d95a9"
selection = { background = "#3f82b4", foreground = "#ffffff" }

[colors.text.links]
default = "#0066cc"
visited = "#7a4cc2"

[colors.input]
border = "#8fa9bf"
border_focus = "#3f82b4"
border_error = "#c42b1c"

[colors.button.primary]
background = "#eef6ff"
foreground = "#10283c"
hover = { background = "#ffffff" }
focus = { outline = "#3f82b4" }

[colors.list.item.hover]
background = "#e5f1fb"
foreground = "#10283c"
secondary_foreground = "#4d6578"

[colors.list.item.selection]
background = "#cce4f7"
foreground = "#10283c"
secondary_background = "#3f82b4"
secondary_foreground = "#4d6578"

[colors.grid.item]
background = "#e8f0f7"
hover = { outline = "#7eb4ea" }
selection = { outline = "#3f82b4" }

[colors.scrollbars]
background = "#b7c9d9"

[colors.loading]
bar = "#3f82b4"
spinner = "#10283c"

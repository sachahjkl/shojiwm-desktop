# The dark side of the Aero theme: the same shapes and blue, on smoked glass,
# matching the menus of the shell in dark mode. Vicinae switches to it when
# the system prefers dark (see aero.json).

[meta]
name = "Aero Dark"
description = "Windows 7 Aero on smoked glass, matching shojiwm-win7 in dark mode"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#4b8fd0"
accent_foreground = "#ffffff"
background = "#1e262e"
foreground = "#e8f1f9"
secondary_background = "#26313b"
border = "#6b8aa6"

[colors.main_window]
border = "#6b8aa6"
footer = { background = "#222c35" }

[colors.settings_window]
border = "#6b8aa6"

[colors.accents]
blue = "#5aa9f0"
green = "#5cbf6c"
magenta = "#d77bb5"
orange = "#f0a050"
red = "#f06a5a"
yellow = "#e0c050"
cyan = "#4fc3d9"
purple = "#a98be8"

[colors.shortcut]
border = "#5d7489"

[colors.text]
default = "#e8f1f9"
muted = "#9fb3c4"
danger = "#f06a5a"
success = "#5cbf6c"
placeholder = "#7f94a6"
selection = { background = "#4b8fd0", foreground = "#ffffff" }

[colors.text.links]
default = "#7fbfff"
visited = "#a98be8"

[colors.input]
border = "#5d7489"
border_focus = "#4b8fd0"
border_error = "#f06a5a"

[colors.button.primary]
background = "#3b4a58"
foreground = "#e8f1f9"
hover = { background = "#4c5f71" }
focus = { outline = "#4b8fd0" }

[colors.list.item.hover]
background = "#2a3d50"
foreground = "#e8f1f9"
secondary_foreground = "#9fb3c4"

[colors.list.item.selection]
background = "#34577a"
foreground = "#ffffff"
secondary_background = "#4b8fd0"
secondary_foreground = "#c9dbea"

[colors.grid.item]
background = "#26313b"
hover = { outline = "#7fb6e6" }
selection = { outline = "#4b8fd0" }

[colors.scrollbars]
background = "#3b4a58"

[colors.loading]
bar = "#4b8fd0"
spinner = "#e8f1f9"

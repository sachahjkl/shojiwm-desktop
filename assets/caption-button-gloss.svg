<svg xmlns="http://www.w3.org/2000/svg" width="29" height="20" viewBox="0 0 29 20" preserveAspectRatio="none">
  <!-- Original artwork. The gloss of one caption button, stretched to its box. -->
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <rect width="29" height="20" fill="url(#button)"/>
</svg>

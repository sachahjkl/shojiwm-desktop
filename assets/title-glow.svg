<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40" preserveAspectRatio="none">
  <!--
    The light behind the caption text.

    Windows blurs the text itself and lays the blur under it. A ShojiWM
    `<Label/>` has no shadow and no blur (SSDStyle in
    packages/shoji_wm/src/types.ts), and copies of the label offset by a pixel
    give a hard outline rather than a glow. This is the other way round: one
    soft shape, already blurred, stretched over the box the text occupies and
    a little beyond it. It has no edge anywhere.

    Measured peak: white at about 45% over the glass at the middle of the
    text, gone 12 px away (docs/aero-measurements.md).
  -->
  <defs>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.52"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.86" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="across" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.08" stop-color="#2b2b2b"/>
      <stop offset="0.18" stop-color="#9a9a9a"/>
      <stop offset="0.30" stop-color="#ffffff"/>
      <stop offset="0.70" stop-color="#ffffff"/>
      <stop offset="0.82" stop-color="#9a9a9a"/>
      <stop offset="0.92" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="ends">
      <rect width="120" height="40" fill="url(#across)"/>
    </mask>
  </defs>
  <rect width="120" height="40" fill="url(#down)" mask="url(#ends)"/>
</svg>
